# =============================================================================
# Regional Health service — local environment
#
# Services:
#   mysql-db      MySQL 8.0        (primary relational store)
#   mongo-db      MongoDB 6.0      (audit store)
#   capacity-api  Node/Express     (the application)
#   prometheus    metrics scraper  (:9090)
#   grafana       dashboards       (:3001)
# =============================================================================

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-lock-wait-timeout=5
    environment:
      MYSQL_ROOT_PASSWORD: labpassword
      MYSQL_DATABASE: capacity_lab
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plabpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lab-net

  mongo-db:
    image: mongo:6.0
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - lab-net

  capacity-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: capacity-api
    environment:
      PORT: 3000
      # OPS-2204 fix: cap V8's old-space below this container's actual 160MB
      # cgroup limit (mem_limit / deploy.resources.limits.memory below),
      # instead of the old 256MB figure that let V8 believe it had more heap
      # room than the kernel would ever grant. 112MB leaves ~48MB (30%)
      # headroom under the 160MB cap for non-heap overhead (native buffers,
      # other V8 spaces, thread stacks), so V8's own allocation-failure
      # handling gets a chance to react before the kernel OOM-killer does.
      NODE_OPTIONS: "--max-old-space-size=112"
      MYSQL_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: labpassword
      MYSQL_DATABASE: capacity_lab
      MONGO_URI: mongodb://mongo-db:27017
      MONGO_DB: capacity_lab
    ports:
      - "3003:3000"
    volumes:
      # Make the seed script runnable from inside the container.
      - ./data-seed/seed.sh:/usr/local/bin/seed.sh:ro
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_started
    # Production runs this service in a 256MB container; locally we cap it
    # tighter at 160MB so the ceiling is reachable within a short test run.
    # OPS-2204: this used to also set NODE_OPTIONS=--max-old-space-size=256,
    # letting V8 believe it had more heap room than either container actually
    # grants. Under the nightly-export load that mismatch let V8 over-commit
    # past the real limit and the kernel OOM-killed the process (RestartCount
    # climbed, ~99% of requests failed during the storm — see LAB_JOURNAL.md /
    # SCARS.md). Fixed by (1) rewriting /api/patients/export to stream
    # bounded chunks instead of materializing the full result set, and (2)
    # capping NODE_OPTIONS below this container's actual limit (see above).
    deploy:
      resources:
        limits:
          memory: 160M
    mem_limit: 160m
    restart: unless-stopped
    networks:
      - lab-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - capacity-api
    networks:
      - lab-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana-data:/var/lib/grafana
      # Auto-provision the Prometheus datasource + a starter dashboard so
      # students investigate systems, not Grafana setup.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
  grafana-data:
